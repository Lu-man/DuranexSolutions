[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[redirects]]
  from = "https://duraweb.com/*"
  to = "https://duranexsolutions.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.duraweb.com/*"
  to = "https://duranexsolutions.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://duratechsoftware.com/*"
  to = "https://duranexsolutions.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.duratechsoftware.com/*"
  to = "https://duranexsolutions.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.duranexsolutions.com/*"
  to = "https://duranexsolutions.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true
